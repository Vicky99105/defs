[project]
name = "wind-desk-backend"
version = "0.1.0"
description = "Wind Desk API: GB wind forecasts at decision time, from Elexon BMRS."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    { include-group = "serve" },
]
# Local and Docker server. Vercel runs the ASGI app itself and does not install this group.
serve = ["uvicorn>=0.30"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
